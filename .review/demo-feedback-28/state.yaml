notes:
  - "QUICKFIX profile, human-directed ('Bárrelo rápido... promueve'). The human asked to skip verification and promote straight to known-good; the orchestrator declined to move the tag to an unverified commit, citing docs/iteration-profiles.md section 6 ('The exact HEAD being promoted must pass ./scripts/verify.sh', marked mandatory) and section 3 ('It is not a shortcut past verification or review'), and proposed the QUICKFIX profile instead. Section 3.1 lists 'incorrect copy' as an eligible example, which is exactly this change."
  - "CLASS-LEVEL SWEEP, not instance patching. Adversarial review had surfaced the SAME defect class three times this session: documentation that asserts more than the code guarantees. Instance A (demo-feedback-26 F1): eligibility.ts docs still called the set 'the votable set' after the screen was relabelled by eligibility. Instance B (demo-feedback-27 F3): the isFocusable comment claimed to observe a style-based ancestor display:none. Instance C (demo-feedback-25 F3): the shared Modal's doc implied a focus contract it did not implement. The orchestrator recorded the class rather than fixing instances as they surfaced, and this iteration sweeps the two modules that carry the confirmed inaccuracies."
  - "The sweep corrected 5 sites in apps/web/src/lib/vote/eligibility.ts, not the 4 the orchestrator listed — plus a 6th the worker found by shape: the citizen-only comment claimed the exact refusal text fires 'even if the power read has not settled', but power === null returns reason 'loading' BEFORE the category check, so the claim was false. The worker CORRECTED THE COMMENT and reported the ordering itself as an out-of-contract discovery rather than changing code, which is the boundary the task set: a comment must describe the code as it is, not as it should be."
  - "The 5 eligibility.ts corrections now state that available mirrors VoteEligibility.eligible and does NOT consider the vote type, so a proposal with an unsupported type stays available and is refused later by the ballot's supportedType rule — i.e. eligible is not castable. The Modal.tsx comment now states what the [hidden] check does and does NOT cover, including that an ancestor hidden by inline display:none is still reported focusable."
  - "Comments-only was PROVEN two independent ways by the worker: (1) diff-level — every added and removed line, after stripping the hunk headers, is a comment line; (2) source-level — comments stripped from HEAD and from the working copy with a state machine respecting string and template literals, then compared, giving IDENTICAL for both files. The orchestrator independently re-ran the diff-level filter before integrating: zero non-comment lines."
  - "Old-string grep: no test or other file asserts on any changed string. tests/vote-availability.test.tsx:247 mentions 'the votable set' only in its own prose comment."
  - "Worker verification: tests/vote-availability.test.tsx and tests/modal-focus-management.test.tsx 2 files / 18 tests passed; typecheck exit 0; lint exit 0 with 0 errors and 17 pre-existing warnings, none in the changed files. One commit. Scope exactly 2 files."
  - "OUT-OF-CONTRACT DISCOVERY to judge (adjacent, not repository-wide): in evaluateVoteEligibility, power === null returns reason 'loading' before the category check, so a Resident viewing a Citizen proposal while the power read is in flight sees 'Checking your eligibility…' rather than the exact 'Colosseum Citizens only' text. The old comment asserted the exact text fired regardless. Whether the ORDERING is intended is a product/code question the sweep deliberately did not act on. The orchestrator should decide whether it warrants its own task; it is transient (the read settles) and no ballot is offered either way."
