notes:
  - "Problem being fixed, reported from the live demo: a resident who IS a Colosseum Citizen was refused the citizen-only Snapshot proposal with 'Colosseum Citizens only', and the Vote screen did not limit its available set to the proposals the viewer could actually vote on."
  - "Root cause, established before implementation and confirmed on chain: apps/web/src/lib/vote/server.ts loadVoteViewerMembership read the manager address on the chain from readMembershipChainId() (42161, Arbitrum One) but resolved the RPC endpoint through readRpcUrlFor(readChainEnv()) — KADE_CHAIN_ENV='testnet' and therefore SEPOLIA_RPC_URL. The chain id and the endpoint came from two disagreeing sources. Membership was verified on chain: membershipOf(0x60b70Ae000a0E3372c3468e4A3446363a921DEf7) == 2 (citizen) on Arbitrum One."
  - "An inventory of every membership read in apps/web/src found exactly ONE defective site; the other three already used readRpcUrlForChain(chainId). It was a localized slip, not a distributed defect class."
  - "Fix verified: server.ts resolves readRpcUrlForChain(chainId) with the SAME chain id it reads the manager on. readRpcUrlFor/readChainEnv are no longer imported and readRpcUrlFor( now appears nowhere in apps/web/src. createServerVoteAdapter already used readRpcUrlForChain(VOTE_CHAIN_ID=42161), and rpcEnvVarForChain(42161) -> ARBITRUM_RPC_URL."
  - "Fail-closed preserved: unreadable membership still returns 'none'; unreadable power (error/unknown) still refuses; power <= 0n still refuses. Core evaluateVoteEligibility is untouched; CITIZEN_ONLY_MESSAGE is still exactly 'Colosseum Citizens only'."
