  - "Regression proof is real and falsifiable: tests/regressions/vote-membership-chain-rpc.test.ts asserts the source invariant and fails on the pre-fix text; apps/web/tests/vote-membership-rpc.test.ts proves BEHAVIOUR by mocking @/lib/env and asserting rpcCalls === ['chain:42161'] and an Arbitrum client — a reverted readRpcUrlFor(readChainEnv()) yields ['env:testnet'] and Sepolia and fails. The worker additionally proved the regression fails against the pre-fix source."
  - "No existing test deleted, skipped or weakened. No migration, schema, contract or @kade/shared change; packages/contracts/** and packages/shared/** untouched."
