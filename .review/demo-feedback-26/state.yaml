notes:
  - "Deliberate paydown of two non-blocking WARN findings that adversarial review had raised and the orchestrator deferred, rather than allowing them to rot as footnotes."
  - "WARN 1 (from demo-feedback-23 F1): the onboarding sign mark rested on an EXTERNAL invariant. useConnectPersistSign sets phase 'done' with verified:false when !canSign, while ConnectedWalletPanel treated every 'done' as verified. It was safe only because ConnectedWalletOwnership requires onBegin/onComplete, so the rail always has canSign === true. A future caller rendering the rail with signMessageAsync but without those callbacks would have marked sign verified WITHOUT any verification. FIX: the hook now surfaces its returned verified flag as ConnectPersistSignController.verified, set true only on the server-accepted path and cleared by run, beginConnecting and reset; the panel drives the sign check from signVerified, not from signPhase === 'done'. The invariant now lives locally in the hook rather than in how a distant owner builds its dependencies. The connect check now keys on the settled phase (attemptDone || signActive), which the worker states is behaviour-identical to the old signActive || signSucceeded on every reachable path, so skipped-never-marks and failed-never-marks are unchanged. ConnectSignRail itself was not edited."
  - "WARN 2 (from demo-feedback-22 W1): the group label 'Open to you' over-promised. An open, category-allowed proposal with a known power but an UNSUPPORTED vote type satisfies eligibility.eligible, so it landed in the available group labelled 'Open to you' while its ballot was refused by the existing supportedType rule. FIX: both labels now name the eligibility decision they encode — 'Eligible to you · N' and 'Not eligible to you · N' — matching the screen's own eligibility vocabulary. evaluateVoteEligibility, deriveVoteProposalAvailability, the fail-closed behaviour and the grouping are untouched; the eligible-but-unsupported proposal stays visible, selectable, data-available=true, and still states its real reason (vote-type-unsupported). Code and comments that claimed the set was 'the votable set' were corrected."
  - "REGESSION EVIDENCE: the worker confirmed BOTH new tests fail against the pre-fix code — the WARN 1 test against signPhase === 'done' yielded ['done','done'] where ['done','upcoming'] was expected, and the WARN 2 test failed the 'Eligible to you' label assertion."
