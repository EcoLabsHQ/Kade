notes:
  - "Fixes demo-feedback-25 finding F3, deferred to its own task because it affects EVERY dialog in the app: the shared apps/web/src/components/ui/Modal.tsx moved focus into the dialog but (1) did not CONTAIN it, so Tab past the last control moved focus to elements BEHIND the dialog, and (2) did not RESTORE it, dropping focus to <body> on close so a keyboard user lost their place."
  - "Fix, contained entirely in Modal.tsx plus a new test file: (1) Containment — the existing document keydown listener now intercepts Tab/Shift+Tab for the TOPMOST open dialog using a module-level openDialogs stack, so only the topmost traps and nested or sibling dialogs cannot contend. Forward from the last focusable wraps to the first, backward from the first wraps to the last, and from the card itself forward enters at the first and backward at the last. The focusable set is RECOMPUTED ON EVERY TAB, so content that changes while open cannot leave a stale node and a focused node that is removed re-enters at the correct end. A dialog with no focusable nodes holds focus on the card. No listener exists while closed. (2) Restoration — document.activeElement is captured at open (treating <body>/<html> as no opener) and restored on cleanup, covering Escape, backdrop, close button, a caller's own action, and unmount. If the opener is gone, disabled or hidden, focus falls back to the first focusable control in the page's main landmark, then to the main element itself, with <body> as the documented last resort."
  - "Byte-for-byte unchanged: role=dialog, aria-modal, aria-labelledby, Escape, backdrop dismiss, click-stop-propagation, the card's overflow:auto / maxHeight:86vh, and the fadeUp entrance. Initial focus still lands on the card (tabIndex=-1) — deliberate and non-destructive."
  - "The worker read ALL SIX consumers and needed to change none: InvestScreen, ColosseumResidency (ClaimableNotice — the exact F3 dialog), FeeStep, MoveToVaultDialog, WealthStep, BankScreen. Per-consumer reasoning was supplied for each."
  - "OUT-OF-CONTRACT DISCOVERY, a pre-existing bug fixed as a direct consequence: MoveToVaultDialog mounts with open already true, and the pre-existing focus effect keyed on [open] alone never ran once mounted flipped, so THAT DIALOG NEVER RECEIVED INITIAL FOCUS. Adding mounted to the dependency list fixes it. No test had covered it; it is now covered. The worker flagged it rather than absorbing it silently."
  - "The worker CORRECTED an assumption in the orchestrator's brief: the brief required 'body scroll restored as it is today', but the shared Modal does NOT lock body scroll at all today — only FullScreenReveal does, via data-overlay-open. The worker left body scroll entirely untouched and said plainly that adding a body-scroll lock to Modal would be a scope addition it did not make. The orchestrator's assumption was wrong."
  - "The worker REFUSED to write a no-op regression file: the root tests/regressions/ harness is node-only (environment 'node', no DOM) and cannot render the Modal or fire key/focus events, so it stated a faithful regression test there is impossible and placed the real DOM assertions in apps/web/tests/modal-focus-management.test.tsx instead (13 assertions)."
  - "Worker verification: the new focus suite 13/13; a 29-file batch covering every test that touches Modal or a consumer, 337/337; a 4-file page-level batch, 21/21; onboarding-flow.test.tsx 41/41 isolated (known load-sensitive flake, did not reproduce); root regressions 7 files / 33 passed; typecheck exit 0; lint exit 0, 0 errors, 17 pre-existing warnings none in changed files."
  - "Worker-declared risk to judge: restoring focus to a gone trigger now lands on the main landmark's first focusable rather than <body>. In the real app every routed page is inside AppShell's <main>, so the target exists; a unit test rendering a consumer without a main falls to <body>, the documented last resort."
  - "Scope check by the orchestrator before integration: exactly 2 files, Modal.tsx and its new test; nothing under packages/**, supabase/**, no lockfile, no dependency."
  - "Operational note: the network dropped three times during this session (opencode.ai, and github.com twice). One push failed with 'Could not resolve host: github.com' AFTER the review-state commit and the local known-good tag had been created, leaving 3 unpushed commits with the local tag ahead of the remote. The orchestrator detected the divergence by comparing local HEAD, origin/main, known-good and the unpushed count, and a clean retry reconciled it with no loss."
