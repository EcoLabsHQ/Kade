- id: F6
  severity: WARN
  scope: safe_derivation
  title: "The 250,000 verification-gas floor was calibration, not a measured sufficient value"
  evidence: "apps/web/src/lib/safe/execute-safe-4337.ts:420-503; the reproduction table recorded in the source and in apps/web/tests/safe-4337-verification-gas.test.ts"
  failure_mode: "CLOSED BY MEASUREMENT, and this warning was load-bearing. A sponsored reproduction on Sepolia with a throwaway passkey Safe changed only verificationGasLimit: 250000 -> AA24, 300000/400000 -> rejected, 450000 -> accepted, 600000 -> accepted with receipt success. When validation runs out of gas the Safe's checkNSignatures treats the failed inner call as an invalid signature, so the EntryPoint reports AA24 — a signature error for a gas shortfall. The floor is now 600000, a measured accepted value."
  materiality: "This is the defect that cost the iteration its final hours and it was predicted here as a WARN. Raised floors are monotone and identical to the old rule for every estimate at or above 400000, so the deploy path is untouched."
  status: resolved
  introduced_by: e151baf
  resolved_by: e7a7f15
  recheck_attempts: 1
