correction_note: "F1 was addressed by bounding the catch-up poll. The fix (9c04a8b, be886e1) races fetchImpl against a timer AND passes an AbortSignal via AbortController — the signal cancels the real socket while the race bounds the await even if an injected fetch ignores the signal. Per-attempt ceiling READ_SOURCE_CATCHUP_ATTEMPT_TIMEOUT_MS = 1_500 ms; total ceiling READ_SOURCE_CATCHUP_TOTAL_TIMEOUT_MS = 8_000 ms, computed as one deadline that both attempts and sleeps draw on. The worker chose a catch-up-specific constant rather than importing EVM_READ_TIMEOUT_MS, because that constant is documented as a PER-ATTEMPT ceiling for a different function and reusing its value as this wait's TOTAL ceiling would be a semantic mismatch — the magnitude was deliberately kept consistent. Worst-case total wait is now 8 s regardless of how many attempts hang. The false claims were corrected: the docstring and both actions.ts comments previously said the wait was bounded by READ_SOURCE_CATCHUP_DELAYS_MS, which was false because the schedule only paces retries when requests settle; they now state both ceilings and the worst-case total. Pre-fix falsification was RUN, not asserted: with the two source files stashed and the new tests kept, the action test fails with 'Test timed out in 20000ms' because the confirmed action's promise never resolves. F2 is NOT fixed — recorded in the helper docstring as an unclosed bounded follow-up, per instruction."
notes:
  - "THIRD attempt at this symptom, and the first with an established cause. The human reported: 'Cuando hice invest, no se hizo autoreload al confirmar la transaccion'. Attempt 1 added a redundant revalidatePath; attempt 2 hypothesised the bounded receipt poll; the human then FALSIFIED that hypothesis explicitly ('Mi transaccion no tardo tanto en confirmarse la verdad'), which reframed the symptom from 'it did not refresh' to 'it refreshed and the screen did not show the change'."
  - "REAL CAUSE ESTABLISHED — refresh-before-data, with a chain of code evidence: (1) the confirmation the screen reports success on comes from the BUNDLER, pack.getUserOperationReceipt in apps/web/src/lib/safe/execute-safe-4337.ts:960, inside completeDeposit/completeWithdraw; (2) the position the screen renders comes from the CHAIN's own JSON-RPC at block tag 'latest', resolved in apps/web/src/lib/wealth/vault-holdings.ts:219-230 (readMorphoPositionFromRpc) and apps/web/src/lib/wealth/evm.ts:640,836 — and these are DIFFERENT PROVIDERS (the demo read endpoint is lb.drpc.live, the bundler is Pimlico); (3) the route is force-dynamic (app/(resident)/invest/page.tsx:16) and the reader performs fresh UNCACHED eth_call/eth_getBalance every render, with no cache(), no unstable_cache, no route cache and no block pinning (the only cached value is the ETH/USD price, which does not affect the USDC-denominated position); (4) both refresh triggers fire on 'sent'. So an immediate re-render re-reads at 'latest' BEFORE the read source has the deposit's block. A fast confirmation makes this MORE likely, which is exactly what the human described."
  - "The worker explicitly RULED OUT the alternative mechanisms against the code rather than assuming: caching, memoisation, a position that does not exist yet, and a different read source than the write source."
  - "FIX: completeDeposit/completeWithdraw now call waitForReadSourceToSeeTransaction (new apps/web/src/lib/invest/read-source-catchup.ts) BEFORE revalidatePath. It polls the SAME endpoint the read uses (via rpcEnvVarForChain) for eth_getTransactionReceipt(transactionHash) on a bounded schedule (immediate plus 250/500/1000/2000/4000 ms). When the source serves the tx, the subsequent re-render reads the post-deposit position. A source that never catches up falls through to revalidation with a 'not-seen' outcome, so a lagging RPC can never hang the success path."
  - "The previously-redundant revalidatePath was KEPT as the server-authoritative half of the refresh, but its COMMENT WAS CORRECTED — it had claimed that router.refresh() alone did not update the screen, which the force-dynamic re-read contradicts. The worker's words: the change 'no longer states a false purpose'."
