notes:
  - "Problem fixed: the residency mint was blocked in the live demo because ensureResidentSafeDeployed refused — the guard derived 0x45dc2d9948B5202Ab5b5bb58F06a9061CF0451ed while the resident's passkey owns 0x60b70Ae000a0E3372c3468e4A3446363a921DEf7."
  - "Root cause: the repository held TWO independent derivations of the same account. Onboarding (relay-kit Safe4337Pack, pinned in execute-safe-4337-env.ts) and the guard (account.ts predictedSafeAddress) disagreed on six inputs at once: Safe version (1.4.1 vs 1.5.0), singleton (L1 0x41675C09... vs SafeL2 0xEdd160fE...), fallback handler (4337 module 0x75cf1146... vs compatibility 0x3EfCBb83...), owner set ([p256Verifier, SafeWebAuthnSharedSigner] vs [signer]), setup to/data (multiSend+enableModules vs empty), and saltNonce ('0' vs keccak256(userId)). Both derivations are individually chain-independent, so the defect was never Arbitrum-specific — the recorded address is 0x60b70Ae0... on BOTH 11155111 and 42161."
  - "Corroborating on-chain evidence: Basescan tx 0x548522f263ac1e1250d3e348a939b19b5ab7a424e6c6e33109da302c56301ff6 created a real counterfactual account through the onboarding path; its calldata carries factory 0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67 and singleton 0x41675C099F32341bf84BFc5382aF534df5C7461a (both v1.4.1) and not the v1.5.0 constants."
  - "The fix refuses the shortcut: hardcoding v1.4.1, or moving only the salt, would NOT reproduce the recorded address — with the singleton and owner set also differing, a salt-only change yields a THIRD address. The guard now re-derives through the onboarding path and hands the engine the account's own SDK-predicted inputs (getPredictedSafe()), so the deployment cannot drift from the derivation again."
  - "Reviewer confirmed the required properties hold: refusal on address disagreement, missing passkey, credential-read failure and missing SDK prediction; byte-exact initializer reconstruction against the committed vector; owner-set verification sound (Safe getOwners() preserves setup-array order); the signer read matches onboarding's inputs exactly (same parseP256PublicKey + String(x)/String(y) + toPasskeySigner(rawId)); no test deleted, skipped or weakened."
