  - "Live-demo defect reported by the human: 'Cuando entro a admin la navbar falla, es decir, el resident no funciona, no aparece la direccion del usuario y atels'. The last word was garbled and never clarified; reconnaissance found no third distinct failure beyond the two below."
  - "DIAGNOSIS, established by a read-only reconnaissance pass before any code: 'admin mode' is NOT a toggle. It is the /admin route, which lives OUTSIDE the (resident) route group and renders its OWN AppShell (apps/web/src/app/admin/page.tsx:36-70). Two concrete defects followed."
  - "Cause 1 — the address never appears because it is NEVER FETCHED. admin/page.tsx:70 rendered <AppShell email nav isReviewer /> with no safeCard and no safeAddress; AppShell defaults safeAddress = null (AppShell.tsx:90) and safeCard is undefined, so Sidebar took its value-prop fallback (Sidebar.tsx:134-145) and SafeAddressCard rendered the placeholder (0x… / 'no account yet'). loadShellSafe was called NOWHERE under apps/web/src/app/admin/. This was a DATA OMISSION, not a throw and not a swallowed catch — the component rendered correctly, with null."
  - "Cause 2 — the 'Resident' half of the Resident/Admin switch was INERT IN EVERY MODE. SidebarFooter.tsx:52-65 hardcoded a static <span> with no href and no onClick, and its white 'active' background made it look like the live current mode while the Admin half was highlighted. That is literally the human's 'el resident no funciona'."
  - "NOT A REGRESSION, verified against history: the admin page has never passed Safe data (checked in a5aa921 and 1830f51) and the static span predates the recent shell refactor (present since the original shell commit 4507c89). The Oct 5 streamed-slot refactor only changed the RESIDENT shell. This is a latent gap the demo made visible, not a break introduced this session."
  - "NO TEST COVERED IT: no test imported @/app/admin/page, and none rendered the admin AppShell/Sidebar with admin nav and asserted the Safe card or the Resident switch. That is why it survived every review — adversarial review examines the diff, and this was never in a diff."
  - "Fix: (1) AdminPage now passes the SAME streamed slot the resident layout uses — <Suspense><ShellSafeCard userId network/></Suspense> — reusing loadShellSafe rather than adding a second read; no record still degrades to the existing 'no account yet' placeholder. (2) A new ResidentSwitchControl replaces the hardcoded span: a real <Link href='/'> , keyboard focusable, accessible name 'Resident', background '#fff' only when residentActive = !adminActive, with aria-current='page' on whichever half is the live mode; the Admin half got the matching aria-current. The resident layout, its streamed slots and resident-mode Sidebar markup are otherwise untouched. activeSettlementChainLabel was exported from AppShell instead of adding a third copy of the helper."
  - "REGRESSION EVIDENCE supplied by the worker: stashing apps/web/src and running the two new test files produced 8/8 FAILURES against the pre-fix code — the safeCard assertion failed because it was undefined and the placeholder rendered, and getByRole('link', { name: 'Resident' }) found nothing because it was a span. Documented in the test file header."
