notes:
  - "Final piece of the residency block, from the live demo: (d) when the 2-minute compliance counter finishes, the navbar shows a RED DOT instead of going blue, and the residency view offers a small button that, when clicked, says citizenship can now be claimed (modal or tooltip); confirming runs the EXISTING citizen animation."
  - "The human explicitly chose to REUSE the existing browser-local localStorage bridge (components/shell/colosseum-attention.ts, key 'kade.colosseum.attention') rather than move the claimable signal server-side. This was a deliberate decision against the orchestrator's recommendation, and the cost is real and must stay documented: the writer only runs while /residency is mounted, so the signal can be stale across sessions and devices."
  - "Implementation: (1) NavItem keeps its EXISTING .kade-nav-dot, grows it to 8px, colours it tokens.danger #B42318 with a static ring, and DROPS the #E6F1FE background / brand text — the ordinary active background (tokens.activeNavBg #EAF2FC) is preserved as the normal 'you are here' state, so only the notification highlight is replaced. Contrast reported ~7:1 inactive and ~8:1 active, and the accessible name announces the claimable state. (2) A real <button> 'Citizenship can now be claimed' (danger-toned pill + dot, aria-haspopup=dialog), keyboard-reachable, opening the shared Modal (role=dialog, aria-modal, named heading, Escape/backdrop close). A modal was chosen over a tooltip because the flow ends in an explicit confirm. (3) Confirm calls the SAME becomeCitizen the primary button uses, so the existing celebratedCitizenRef one-shot guard means the reveal fires once; the test asserts playCitizenshipCue called once and a single .kade-celebration-bloom for a resident who opened the prompt and then confirmed. (4) The bridge docstring now states it is written only while /residency is mounted, can be stale across sessions/devices, never means 'citizen'; a same-browser storage listener syncs sibling tabs; it is cleared on becoming a citizen. (5) Reduced motion gates the notice dot pulse via usePrefersReducedMotion and the nav breathe is disabled by the existing CSS media query."
  - "Worker verification: 26 residency/shell test files / 283 tests passed; root regressions 7 files / 33 passed INCLUDING tests/regressions/residency-window-lifecycle.test.ts (7 passed, unchanged) — the invariant promoted in demo-feedback-24 is intact; typecheck OK; lint 0 errors / 17 pre-existing warnings in untouched files; no lockfile change."
  - "Worker-declared risk to judge: a LEGACY persisted window without a claimed pass can set the nav dot while the residency view still shows the claim card and no notice. The normal claim-first flow is unaffected and the server gate is unchanged, but the two surfaces can disagree in that legacy state."
  - "3 commits: f39f305 shell red dot, f672815 residency claim notice + modal, c67fe64 tests."
  - "Scope check by the orchestrator before integration: 7 files, none under packages/**, supabase/**, no lockfile, none in lib/vote, components/vote, components/onboarding or components/wallet."
