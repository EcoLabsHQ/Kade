    severity: WARN
    scope: frontend
    title: "The rail's done -> verified equivalence rests on an external invariant"
    evidence: "apps/web/src/components/wallet/useConnectPersistSign.ts:222-227, apps/web/src/components/wallet/ConnectedWalletPanel.tsx:692,129-133"
    failure_mode: "useConnectPersistSign sets phase 'done' with verified:false when !canSign. ConnectedWalletPanel:692 treats every 'done' as signSucceeded. A future caller that rendered the rail with signMessageAsync defined but onBegin/onComplete absent would mark sign verified without any verification."
    materiality: "Latent coupling only. Unreachable on this candidate: ConnectedWalletOwnership requires onBegin/onComplete (ConnectedWalletPanel:129-133) and OnboardingFlow.tsx:169 constructs ownership only when both exist, so the rail always has canSign === true."
    status: open
