notes:
  - "Two small defects reported by the human immediately after a FULLY SUCCESSFUL live demo: '1. Cuando hice invest, no se hizo autoreload al confirmar la transaccion' and '2. Cuando reclame el citizenship, la tx que aparecia abajo era la de residency todavia'. Two INDEPENDENT defects, one commit each."
  - "BUG 1 ROOT CAUSE, established: completeDeposit and completeWithdraw in apps/web/src/app/invest/actions.ts returned the engine's confirmed 'sent' outcome but NEVER revalidated the route. The only refresh trigger was the client's router.refresh() in InvestScreen.tsx (guarded by result.status === 'sent'). A Server Action response only carries a freshly rendered route when the ACTION ITSELF revalidates the path, so the confirmed position never reached the screen as part of the completed action. Every other write path in the repo (holdings/link-actions.ts, the residency actions) calls revalidatePath; the invest actions were the exception. FIX: revalidatePath('/invest') when and ONLY when outcome.status === 'sent', for both actions. A gated build, an unsigned submit and a reverted receipt revalidate nothing, so a refusal cannot present as success or trigger a misleading refresh. The existing router.refresh() is untouched."
  - "BUG 2 ROOT CAUSE, established: MintReceipt derived the credential it describes from the CLIENT-SIDE claim target — whichever state rendered it (StateE passes target='citizen') — NOT from the confirmed membership transition (outcome.operation) whose hash it links. So a confirmed outcome with operation 'issue-resident' rendered under the Citizen label and linked the residency transaction. FIX: resolve the credential from outcome.operation ('issue-resident' -> resident, 'promote-to-citizen' -> citizen), falling back to the requested target only while the mint is pending or refused and no operation exists. The noun, state, data-testid and the demo artifact serial all follow the resolved credential, and the serial is OMITTED when it would describe a different transaction."
  - "PRE-FIX FAILURE EVIDENCE (falsifiable): with the two source files checked out from d30fc6c and the new tests kept, EXACTLY 3 tests fail — completeDeposit revalidates-only-for-confirmed, completeWithdraw revalidates-only-for-confirmed, and the residency test asserting the receipt binds to the confirmed transition rather than the client claim target."
