  - "HONEST LIMIT declared by the worker, worth judging: the exact production trigger for bug 1 is NOT 100% proven. A confirmed 'sent' should have let router.refresh() re-read a force-dynamic uncached route; the alternative is the bounded receipt poll (RECEIPT_POLL_DELAYS_MS, about 30 s) missing and reporting pending. That poll limitation is unchanged, reports honestly, and never as success."
  - "RECORDED WARN STATUS, reported rather than claimed fixed: the pre-existing WARN about the demo serial under 'Issued on chain' is RELATED but NOT the same root cause and is NOT resolved by this candidate. The WARN concerns the receipt's SERIAL coming from the demo progress; the mint outcome carries no tokenId, so an honest serial needs a tokenId read that is out of scope. The serial remains the demo value for the matching credential. What IS fixed is the label/hash correspondence that the WARN's finding sits beside."
