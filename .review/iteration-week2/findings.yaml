- id: F1
  severity: FAIL
  scope: shell
  title: "Unconditional 'Pre-approved' banner with a fabricated reference"
  evidence: >-
    apps/web/src/components/shell/AppShell.tsx:77 renders PreApprovedBanner with
    no status prop; PreApprovedBanner.tsx:23-30 asserts 'Pre-approved' and a
    fixed 'Ref CW-2026-0409'. Overview renders a second, demo-labelled banner.
  failure_mode: >-
    Every authenticated screen claims a pre-approved status and a reference that
    matches no record, even when the fee is unpaid or the application is blocked.
  materiality: "Factually false account status; contradicts the review gate."
  status: open
  owner_instruction: "The owner asked for this banner to be visible at all times."

- id: F2
  severity: FAIL
  scope: residency
  title: "Residency fabricates a document intake and submission state"
  evidence: >-
    ResidencyStep.tsx:133 '5 of 6 uploaded · hashed & pinned' with a no-op
    Upload; :178-182 'Your package is with the Immigration Service'; :200,256
    'Submitted · in review' / 'Ready' from gated/nonexistent states.
  failure_mode: >-
    Tells the resident documents are uploaded and the package is with the
    Immigration Service when neither happened and permit issuance is blocked.
  materiality: "Misrepresents real-world action the contract says must be real."
  status: open
  owner_instruction: "The owner asked for the baseline copy/visual to be identical."

- id: F3
  severity: FAIL
  scope: invest
  title: "Wired Morpho instrument labelled Base, contradicting the mainnet decision"
  evidence: >-
    InvestScreen.tsx:60-67 Morpho row chain 'Base' with wired: true;
    morpho-config.ts:113 chainId is CHAIN_IDS.ethereum; dialog shows
    'Pool chain Ethereum · 1' (InvestScreen.tsx:453).
  failure_mode: >-
    A depositor is told the wired instrument is a Base vault while the call path
    is Ethereum mainnet, and the screen claims Arbitrum/Base support.
  materiality: "The chain of a deposit is material and is misstated."
  status: open
  owner_instruction: "The owner asked to keep the baseline instrument list."

